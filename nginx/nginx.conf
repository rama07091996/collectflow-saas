# ==============================================================================
# CollectFlow Local & Production Nginx Reverse Proxy Configuration
# Handles Next.js App Router (Port 3000) + Java Tomcat Backend (Port 8080)
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Upstream Next.js Frontend
    upstream nextjs_frontend {
        server 127.0.0.1:3000;
        keepalive 32;
    }

    # Upstream Java Spring Boot / Tomcat Backend
    upstream tomcat_backend {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost 127.0.0.1;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # -------------------------------------------------------------
        # 1. Route Java Tomcat / Spring Boot API Traffic (/api/v1/)
        # -------------------------------------------------------------
        location /api/v1/ {
            proxy_pass http://tomcat_backend/api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;

            # Stripe Webhook raw payload buffering
            client_max_body_size 10M;
        }

        # -------------------------------------------------------------
        # 2. Route Next.js Frontend & Serverless Routes (/)
        # -------------------------------------------------------------
        location / {
            proxy_pass http://nextjs_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Next.js Static Cache Optimization
        location /_next/static/ {
            proxy_pass http://nextjs_frontend/_next/static/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}
